<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>포토팀빌딩</title><style>
:root{font-family:Pretendard,'Malgun Gothic',sans-serif;color:#142d67;background:#faf7f1}*{box-sizing:border-box}html{color-scheme:light;background:#f4f0e8}body{margin:0;min-height:100vh;background:#f4f0e8;color:#142d67}.wrap{background:#f4f0e8}input::placeholder,textarea::placeholder{color:#66738b;opacity:1}input:disabled,textarea:disabled{background:#eef1f5;color:#46536a;opacity:1}[aria-invalid="true"]{border:2px solid #d7473e;background:#fff7f5}.missing-flash{animation:missingFlash .45s ease-in-out 3}@keyframes missingFlash{0%,100%{box-shadow:0 0 0 0 rgba(215,71,62,0)}50%{border-color:#d52626;box-shadow:0 0 0 5px rgba(215,38,38,.3)}}.field-error{display:block;color:#b42318;font-size:13px;font-weight:700;margin:7px 0}.missing-group{border-radius:12px;padding:4px}.date-control{display:flex;gap:8px;align-items:center}.date-control input{flex:1;min-width:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:22px;font-weight:900}.brand span{color:#ff6b61}.badge{background:#e8efff;color:#3659a5;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:bold}.hero,.panel,.card{background:white;border:1px solid #ece9e3;border-radius:22px;box-shadow:0 7px 24px #19356c0a}.hero{max-width:480px;margin:5vh auto;padding:32px}.hero h1{font-size:38px;line-height:1.2;margin:20px 0 12px}.muted{color:#7a8497;font-size:14px;line-height:1.6}.field{display:block;font-weight:700;font-size:14px;margin:18px 0 8px}input,textarea,select{width:100%;border:1px solid #dce1eb;border-radius:12px;padding:13px;background:white;color:#172e60}textarea{min-height:90px;resize:vertical}.btn{border-radius:12px;background:#2954b5;color:white;padding:13px 18px;font-weight:800}.btn.coral{background:#ff6b61}.btn.light{background:#eef3ff;color:#254ca6}.btn.outline{background:white;border:1px solid #dce1eb;color:#25427d}.full{width:100%;margin-top:20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.panel{padding:24px;margin-bottom:18px}.timer{background:linear-gradient(125deg,#315fbd,#172f78);color:white;border-radius:20px;padding:22px;min-width:220px}.timer strong{display:block;font-size:42px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:20px;text-align:left;color:inherit;position:relative}.card:hover{transform:translateY(-2px)}.card h3{margin:18px 0 8px}.card p{font-size:13px;color:#7a8497;line-height:1.5}.num{display:inline-grid;place-items:center;width:34px;height:34px;background:#edf2ff;color:#315abc;border-radius:11px;font-weight:bold}.status{font-size:12px;font-weight:800;color:#258856;background:#e6f7ed;padding:6px 9px;border-radius:20px}.status.wait{color:#8993a4;background:#f1f3f6}.layout{display:grid;grid-template-columns:1fr 340px;gap:18px}.side{background:#fff5ed;border-radius:20px;padding:20px}.side h3{margin-top:0}.selection{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.option{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #e7e9ee;border-radius:10px;font-size:13px;color:#36496e}.option input{width:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:13px 8px;border-bottom:1px solid #edf0f4;text-align:center}.table th:first-child,.table td:first-child{text-align:left}.photo{width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-top:10px}.notice{background:#fff4e9;color:#9b622f;padding:13px;border-radius:12px;font-size:13px;line-height:1.5}.tabs button{margin-right:6px}.small{font-size:12px}.empty{text-align:center;padding:36px;color:#929bad}.missionhead{display:flex;gap:16px;align-items:center}.hide{display:none}@media(max-width:700px){.wrap{padding:16px}.hero{margin:2vh auto;padding:25px}.hero h1{font-size:32px}.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.selection{grid-template-columns:1fr}.panel{padding:18px}.timer strong{font-size:34px}.table{min-width:600px}.scroll{overflow:auto}.top{margin-bottom:18px}}
</style></head><body><div id="app"></div><script>
const easy=['우리의 팀워크','우리 팀의 첫인상','우리가 닮은 것','함께라서 가능한 순간','우리 팀의 에너지','우리 팀의 공통점','우리를 웃게 하는 것','우리 팀을 표현하는 한 단어','지금 이 순간, 우리'];
const creative=['10년 뒤, 우리 팀은?','오늘의 기분 예보','외계인이 발견한 우리','우리 팀이 영화가 된다면','비밀 작전 수행 중','중력이 사라진 세상','오늘의 뉴스 속보','우리 팀 사용설명서','미래에서 온 단체사진','시간이 멈춘 순간','우리 팀의 초능력','뜻밖의 영웅','우리가 발견한 보물','반전의 순간','지구 마지막 여행자','사라진 것을 찾아서','우리 팀이 만든 신기록','지구에 불시착한 외계인','우리 팀이 동화 속 주인공이라면','아무도 모르는 우리 팀의 정체','하루 동안 성별이 바뀐다면','머나먼 과거로의 여행'];
const descriptions=['팀원들이 함께 만들어내는 협동의 순간을 담아주세요.','우리 팀을 처음 만났을 때의 느낌을 표현해 주세요.','우리 팀이 닮았다고 생각하는 무언가를 담아주세요.','함께하기에 가능한 순간을 표현해 주세요.','지금 우리 팀이 가진 에너지를 담아주세요.','팀원들이 함께 가진 공통점을 표현해 주세요.','우리 팀을 웃게 만드는 순간을 담아주세요.','우리 팀을 나타내는 한 단어를 사진으로 표현해 주세요.','지금 이 순간의 우리 팀을 담아주세요.'];
const cd=['10년 뒤 우리 팀의 모습을 상상해 담아주세요.','지금 우리 팀의 분위기를 날씨로 표현해 주세요.','외계인의 눈에 비친 우리 팀을 담아주세요.','우리 팀이 주인공인 영화의 한 장면을 표현해 주세요.','비밀 임무를 수행하는 우리 팀을 담아주세요.','중력이 사라진 세상 속 우리 팀을 표현해 주세요.','우리 팀의 놀라운 소식을 사진으로 전해 주세요.','우리 팀을 이해하는 데 필요한 특징을 담아주세요.','미래에서 발견된 우리 팀의 사진을 표현해 주세요.','시간이 멈춘 듯한 순간을 담아주세요.','우리 팀만의 특별한 능력을 표현해 주세요.','뜻밖의 순간에 나타난 영웅을 담아주세요.','우리 팀이 발견한 소중한 보물을 소개해 주세요.','예상과 다른 일이 벌어진 순간을 담아주세요.','지구에 마지막으로 남은 우리 팀을 표현해 주세요.','사라진 무언가를 찾는 이야기를 담아주세요.','우리 팀이 세운 특별한 기록을 소개해 주세요.','지구에 불시착한 외계인의 모습을 담아주세요.','동화 속 주인공이 된 우리 팀을 표현해 주세요.','아무도 몰랐던 우리 팀의 정체를 공개해 주세요.','하루 동안 성별이 바뀐 상황을 상상해 담아주세요.','머나먼 과거로 여행한 우리 팀을 표현해 주세요.'];
const defaults=[...easy,...creative].map((title,i)=>({title,description:[...descriptions,...cd][i],category:i<easy.length?'easy':'creative',active:true})); const key='photo-team-prototype-v1'; let db=JSON.parse(localStorage.getItem(key)||'{"rooms":[]}'); db.topics=db.topics||defaults;for(const r of db.rooms){if(!r.missionSnapshot)r.missionSnapshot=Object.fromEntries(r.missions.map(i=>[i,{...db.topics[i]}]))}localStorage.setItem(key,JSON.stringify(db));let topics=db.topics;const all=new Proxy([], {get:(_,p)=>topics[p]?.title});const desc=new Proxy([], {get:(_,p)=>topics[p]?.description}); let state={page:'home',room:null,team:null,mission:null,selected:[],adminRoom:null}; const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); function save(){localStorage.setItem(key,JSON.stringify(db))} function room(){return db.rooms.find(x=>x.id===state.room)} function adminRoom(){return db.rooms.find(x=>x.id===state.adminRoom)} function topicTitle(r,i){return r?.missionSnapshot?.[i]?.title??topics[i]?.title??'삭제된 주제'} function topicDesc(r,i){return r?.missionSnapshot?.[i]?.description??topics[i]?.description??''} function team(){return room()?.teams.find(x=>x.id===state.team)} function ended(r){return r.status==='ended'||(r.status==='running'&&Date.now()>=r.endsAt)} function remaining(r){return r.status==='running'?Math.max(0,r.endsAt-Date.now()):r.remaining||0} function clock(ms){let n=Math.ceil(ms/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')} function random(a,n){return [...a].sort(()=>Math.random()-.5).slice(0,n)} function header(){return `<div class="top"><div class="brand" onclick="go('home')" style="cursor:pointer">📸 포토팀빌딩</div></div>`} function go(p){state.page=p;render()} function render(){const app=$('app'); app.innerHTML=`<main class="wrap">${header()}${({home,create,admin,participant,mission,results,presentation,topicsPage}[state.page]||home)()}<footer style="text-align:center;padding:36px 12px 20px;color:#596984;font-size:13px;line-height:1.8"><p>© 2026 creodedulab. All rights reserved.</p><a class="btn light" style="display:inline-block;text-decoration:none" href="https://creodedulab.github.io/" target="_blank" rel="noopener noreferrer">크레오디 공식 홈페이지 ↗</a></footer></main>`;}
function home(){return `<section class="hero"><div class="badge" style="display:inline-block">함께라서 더 즐거운 시간 ✨</div><h1>우리의 순간을<br><span style="color:#ff6b61">사진으로!</span></h1><p class="muted">팀원들과 미션을 수행하고<br>특별한 순간을 함께 남겨보세요.<br>팀당 대표자 한 명이 제출합니다.<br>같은 기기에서 재접속할 때는 입장 코드만 입력하세요.</p><label class="field">입장 코드</label><input id="code" oninput="clearMissing(this)" placeholder="방 입장 코드 또는 관리자 코드" autocomplete="off"><label class="field">팀 이름 <span class="muted">참가자만 입력</span></label><input id="teamname" oninput="clearMissing(this)" placeholder="예: 반짝이는 우리 팀"><button class="btn full" onclick="enter()">입장하기 →</button></section>`}
function openCalendar(id){let el=$(id);if(!el)return;try{if(typeof el.showPicker==='function'){el.showPicker();return}}catch(e){}el.focus()}
function clearMissing(el){el.removeAttribute('aria-invalid');el.classList.remove('missing-flash');let message=el.parentElement?.querySelector('[data-error-for="'+el.id+'"]');if(message)message.remove()}
function showMissing(items){document.querySelectorAll('.field-error').forEach(el=>el.remove());document.querySelectorAll('[aria-invalid="true"]').forEach(el=>el.removeAttribute('aria-invalid'));document.querySelectorAll('.missing-flash').forEach(el=>el.classList.remove('missing-flash'));let first=null;for(let [id,label] of items){let el=id&&$(id);if(!el)continue;el.setAttribute('aria-invalid','true');let msg=document.createElement('span');msg.className='field-error';msg.dataset.errorFor=id;msg.textContent=label+' 항목을 입력하거나 선택해 주세요.';msg.setAttribute('role','alert');el.insertAdjacentElement('afterend',msg);if(!first)first=el}if(first){first.scrollIntoView({behavior:'smooth',block:'center'});first.classList.remove('missing-flash');void first.offsetWidth;first.classList.add('missing-flash');if(first.matches('input,textarea,select'))first.focus({preventScroll:true})}}
function enter(){let code=$('code').value.trim().toUpperCase();if(code==='ADMIN'){state.adminRoom=null;go('admin');return}let r=db.rooms.find(x=>x.code===code);if(!r)return showMissing([['code',code?'올바른 입장 코드':'입장 코드']]);let name=$('teamname').value.trim();let remembered=JSON.parse(localStorage.getItem('photo-team-reentry')||'{}');if(!name&&remembered[r.code])name=remembered[r.code];if(!name)return showMissing([['teamname','팀 이름']]);remembered[r.code]=name;localStorage.setItem('photo-team-reentry',JSON.stringify(remembered));let t=r.teams.find(x=>x.name===name);if(!t){t={id:crypto.randomUUID(),name,submissions:{}};r.teams.push(t);save()}state.room=r.id;state.team=t.id;go('participant')}
function create(){let counts=[state.selected.filter(i=>topics[i]?.category==='easy').length,state.selected.filter(i=>topics[i]?.category==='creative').length];function list(category){return topics.map((t,i)=>t.active&&t.category===category?`<label class="option"><input type="checkbox" ${state.selected.includes(i)?'checked':''} onchange="toggle(${i},this.checked)"><span><b>${esc(t.title)}</b><br><small>${esc(t.description)}</small></span></label>`:'').join('')}return `<div class="row between"><div><span class="badge">새로운 시작</span><h1>새 방 만들기</h1><p class="muted">두 가지 유형에서 각각 3개씩 골라주세요.</p></div><button class="btn outline" onclick="go('admin')">← 돌아가기</button></div><div class="layout"><div><section class="panel"><label class="field">방 이름</label><input id="roomname" value="${esc(state.roomName||'') }" oninput="state.roomName=this.value" placeholder="예: 2026 우리 팀 워크숍"><label class="field">행사 날짜</label><input type="date" id="eventDate" aria-label="행사 날짜" value="${esc(state.eventDate||'')}" onclick="openCalendar('eventDate')" onchange="state.eventDate=this.value;clearMissing(this)"><label class="field">저장한 미션 조합</label><div class="row"><select id="presetSelect" style="flex:1"><option value="">조합 선택</option>${(db.presets||[]).map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('')}</select><button class="btn light" onclick="loadPreset()">불러오기</button><button class="btn outline" onclick="savePreset()">현재 조합 저장</button><button class="btn outline" onclick="renamePreset()">이름 변경</button><button class="btn outline" onclick="deletePreset()">삭제</button></div><div class="row between"><h3>☀️ 가볍게 시작하기 <span class="muted">${counts[0]} / 3</span></h3><button class="btn light" onclick="randomize(0)">무작위 선택</button></div><div id="easyGroup" class="missing-group"><div class="selection">${list('easy')}</div></div></section><section class="panel"><div class="row between"><h3>✨ 상상력과 가상의 상황 <span class="muted">${counts[1]} / 3</span></h3><button class="btn light" onclick="randomize(1)">무작위 선택</button></div><div id="creativeGroup" class="missing-group"><div class="selection">${list('creative')}</div></div></section></div><aside class="side"><h3>선택한 미션</h3><p class="muted">각 유형에서 3개씩, 총 6개를 선택해 주세요.</p>${state.selected.length?state.selected.map(i=>`<p class="small">✓ ${esc(topics[i].title)}</p>`).join(''):'<p class="muted">아직 선택한 미션이 없어요.</p>'}<button class="btn coral full" onclick="makeRoom()">방 만들기</button></aside></div>`}

function selectedPreset(){let v=$('presetSelect').value;return v===''?-1:Number(v)}
function renamePreset(){let i=selectedPreset();if(i<0)return alert('조합을 선택해 주세요.');let n=prompt('새 이름을 입력해 주세요.',db.presets[i].name);if(n?.trim()){db.presets[i].name=n.trim();save();render()}}
function deletePreset(){let i=selectedPreset();if(i<0)return alert('조합을 선택해 주세요.');if(confirm('이 미션 조합을 삭제할까요?')){db.presets.splice(i,1);save();render()}}
function topicsPage(){return `<div class="row between"><div><span class="badge">미션 라이브러리</span><h1>주제 관리</h1><p class="muted">기존 방에는 생성 당시의 주제와 설명이 유지됩니다.</p></div><button class="btn outline" onclick="go('admin')">← 방 목록</button></div><section class="panel"><h2>새 주제 추가</h2><select id="topicCategory"><option value="easy">가볍게 시작하기</option><option value="creative">상상력과 가상의 상황</option></select><label class="field">주제</label><input id="topicTitle" placeholder="주제 이름"><label class="field">안내 설명</label><textarea id="topicDescription" placeholder="사진에 담을 주제나 의미를 간단히 적어주세요"></textarea><button class="btn full" onclick="addTopic()">주제 추가</button></section><section class="panel"><h2>등록된 주제</h2>${topics.map((t,i)=>t.active?`<div class="option" style="margin:8px 0;justify-content:space-between"><div><span class="badge">${t.category==='easy'?'가볍게':'상상력'}</span><b> ${esc(t.title)}</b><p class="muted">${esc(t.description)}</p></div><div class="row"><button class="btn light" onclick="editTopic(${i})">수정</button><button class="btn outline" onclick="removeTopic(${i})">삭제</button></div></div>`:'').join('')}</section>`}
function addTopic(){let title=$('topicTitle').value.trim(),description=$('topicDescription').value.trim();let missing=[];if(!title)missing.push(['topicTitle','주제']);if(!description)missing.push(['topicDescription','안내 설명']);if(missing.length)return showMissing(missing);topics.push({title,description,category:$('topicCategory').value,active:true});save();render()}
function editTopic(i){let t=topics[i],title=prompt('주제 이름',t.title);if(title===null)return;let description=prompt('안내 설명',t.description);if(description===null)return;if(!title.trim()||!description.trim())return alert('주제와 설명을 입력해 주세요.');t.title=title.trim();t.description=description.trim();save();render()}
function removeTopic(i){if(!confirm('이 주제를 목록에서 삭제할까요? 기존 방에는 유지됩니다.'))return;topics[i].active=false;save();render()}
function savePreset(){if(state.selected.filter(i=>topics[i]?.category==='easy').length!==3||state.selected.filter(i=>topics[i]?.category==='creative').length!==3)return alert('각 유형에서 3개씩 먼저 선택해 주세요.');let name=prompt('미션 조합 이름을 입력해 주세요.');if(!name||!name.trim())return;db.presets=db.presets||[];db.presets.push({name:name.trim(),missions:[...state.selected]});save();render()}
function loadPreset(){let value=$('presetSelect').value;if(value==='')return alert('저장한 조합을 선택해 주세요.');let preset=(db.presets||[])[Number(value)];if(preset){if(preset.missions.some(i=>!topics[i]?.active))return alert('삭제된 주제가 포함된 조합입니다. 주제를 다시 선택해 주세요.');state.selected=[...preset.missions];render()}}

async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('이 브라우저에서는 전체화면을 사용할 수 없습니다.')}}
function downloadPhoto(id,i){let r=adminRoom(),t=r?.teams.find(x=>x.id===id),s=t?.submissions[i];if(!r||!ended(r)||!s)return;let a=document.createElement('a');a.href=s.photo;a.download=(t.name+'-'+all[i]).replace(/[\\/:*?"<>|]/g,'_')+'.jpg';document.body.appendChild(a);a.click();a.remove()}
async function downloadResults(){let r=adminRoom();if(!r||!ended(r))return;let items=slides();if(!items.length)return alert('내려받을 제출물이 없습니다.');let html='<!doctype html><html lang="ko"><meta charset="utf-8"><title>팀빌딩 결과</title><style>body{font-family:sans-serif;max-width:900px;margin:auto;padding:24px}article{break-inside:avoid;border-bottom:1px solid #ddd;padding:20px 0}img{max-width:100%;max-height:600px;object-fit:contain}</style><h1>'+esc(r.name)+' · 제출 결과</h1>';for(let x of items){let a=x.submission;html+='<article><h2>'+esc(x.team)+' · '+esc(all[x.mission])+'</h2><img src="'+a.photo+'" alt="제출 사진"><h3>'+esc(a.title)+'</h3><p>'+esc(a.description).replace(/\n/g,'<br>')+'</p><p>'+esc(a.message)+'</p></article>'}html+='</html>';let url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='팀빌딩-제출결과.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function deleteTeam(id){let r=adminRoom();if(!r||!ended(r)||!confirm('이 팀과 모든 제출물을 삭제할까요? 되돌릴 수 없습니다.'))return;r.teams=r.teams.filter(t=>t.id!==id);save();render()}
function deleteSubmission(id,i){let r=adminRoom(),t=r?.teams.find(x=>x.id===id);if(!r||!ended(r)||!t||!confirm('이 사진과 제목, 설명, 한마디를 모두 삭제할까요? 되돌릴 수 없습니다.'))return;delete t.submissions[i];save();render()}
function deleteRoom(){let r=adminRoom();if(!r||!confirm('이 방과 모든 팀의 제출물을 삭제할까요? 되돌릴 수 없습니다.'))return;db.rooms=db.rooms.filter(x=>x.id!==r.id);state.adminRoom=null;save();render()}
function slides(){let r=adminRoom();if(!r||!ended(r))return [];return r.teams.flatMap(t=>r.missions.filter(i=>t.submissions[i]).map(i=>({team:t.name,mission:i,submission:t.submissions[i]})))}
function startPresentation(){if(!slides().length)return alert('발표할 제출물이 아직 없습니다.');state.slide=0;go('presentation')}
function presentation(){let items=slides(),item=items[state.slide];if(!item)return '<div class="panel">발표할 제출물이 없습니다.</div>';let s=item.submission;return `<div class="row between"><div><span class="badge">발표 화면 · ${state.slide+1} / ${items.length}</span><h1>${esc(item.team)}</h1><p class="muted">${esc(all[item.mission])}</p></div><div class="row"><button class="btn light" onclick="toggleFullscreen()">⛶ 전체화면</button><button class="btn outline" onclick="go('results')">발표 종료</button></div></div><section class="panel" style="max-width:950px;margin:auto"><label class="field" for="slideSelect">발표할 팀과 미션 선택</label><select id="slideSelect" onchange="state.slide=Number(this.value);render()">${items.map((x,n)=>`<option value="${n}" ${n===state.slide?'selected':''}>${esc(x.team)} · ${esc(all[x.mission])}</option>`).join('')}</select><img class="photo" style="max-height:58vh;object-fit:contain;background:#f3f5f9" src="${s.photo}" alt="제출 사진"><h2>${esc(s.title)}</h2><p>${esc(s.description)}</p><p class="muted">“${esc(s.message)}”</p><div class="row between"><button class="btn light" onclick="state.slide--;render()" ${state.slide===0?'disabled':''}>← 이전</button><span class="muted">${state.slide+1} / ${items.length}</span><button class="btn" onclick="state.slide++;render()" ${state.slide===items.length-1?'disabled':''}>다음 →</button></div></section>`}
setInterval(()=>{let r=state.page==='admin'?adminRoom():room();if(!r)return;if((state.page==='participant'||state.page==='mission')&&r.status==='running'){let left=remaining(r),thresholds=[600000,300000,60000],seen=state.timerSeen||{};for(let limit of thresholds){let k=r.id+'-'+r.timerVersion+'-'+limit;if(left<=limit&&!seen[k]){seen[k]=true;if(left>0){state.timerNotice='미션 종료까지 '+(limit/60000)+'분 남았습니다!';state.timerSeen=seen;if(state.page==='participant')render();else {let notice=document.createElement('div');notice.className='notice';notice.setAttribute('role','alert');notice.textContent='⏰ '+state.timerNotice;document.querySelector('main').prepend(notice)}}break}}state.timerSeen=seen}if(r.status==='running'&&Date.now()>=r.endsAt){r.status='ended';r.remaining=0;save();render();return}document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=clock(remaining(r)))},1000);window.addEventListener('storage',e=>{if(e.key===key){db=JSON.parse(e.newValue||'{"rooms":[]}');db.topics=db.topics||defaults;topics=db.topics;render()}});render();
</script></body></html>
